<html lang="en"><head><meta charset="utf-8">

<style>

nav{max-width:1000px;margin:12px auto 0;padding:0 12px;display:flex;gap:6px;overflow-x:auto}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.stat b{font-size:26px;display:block}.stat span{color:var(--mu);font-size:13px}

.sos{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#fff;border:0;border-radius:30px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px #0005;cursor:pointer}
@keyframes up{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 #d92d2099}70%{box-shadow:0 0 0 18px #d92d2000}100%{box-shadow:0 0 0 0 #d92d2000}}
@keyframes blink{50%{opacity:.4}}
@keyframes sh{from{background-position:0 0}to{background-position:200% 0}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
header{background:linear-gradient(110deg,#000,#8a0c18,#e11d2e,#ff7a18,#e11d2e,#8a0c18,#000);background-size:200% 100%;border-bottom:2px solid #fbbf24;animation:sh 8s linear infinite}
h1{animation:pop .6s cubic-bezier(.2,.8,.2,1) backwards}
.card{animation:up .5s cubic-bezier(.2,.8,.2,1) backwards;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0002;border-color:var(--bl)}
.na .card{animation:none}
h2{animation:up .5s backwards}
.sos{animation:pulse 1.8s infinite;transition:transform .15s}.sos:hover{transform:scale(1.08)}.sos:active{transform:scale(.94)}
.alert.Emergency .tag,.tag.Critical{animation:blink 1.3s infinite}
.btn,nav button,.roles button{transition:transform .15s,background .2s,filter .2s,border-color .2s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active,nav button:active,.roles button:active{transform:scale(.94)}nav button:hover{border-color:var(--bl)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bl);outline-offset:1px;transition:outline .15s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.Medium{color:#60a5fa}.btn{background:linear-gradient(135deg,#e11d2e,#ff5a36);color:#fff}.btn.r{background:#e11d2e;color:#fff}.btn.g{background:#34d399;color:#052e1f}.roles button.on{color:#e11d2e}.ht span:nth-of-type(2){background:#fbbf24;color:#1a1200;text-shadow:none}.ht span:nth-of-type(3){background:#22d3ee;color:#00232b;text-shadow:none}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.card:hover{box-shadow:0 10px 26px #fbbf2430}.card{box-shadow:0 0 0 #0000}
h2{border-left:4px solid var(--am);padding-left:8px}
a{color:#5eead4}
.pin{cursor:pointer}.pin:hover circle,.pin:hover rect{filter:brightness(1.35)}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.6s infinite}
